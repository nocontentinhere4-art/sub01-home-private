<!doctype html>
<!-- Mock of the "iframe embed" page the Vagon dashboard hands out: the stream page inside an iframe that fills
     the window (docs.vagon.io: id="vagonFrame", allow="autoplay; microphone *; ..."). The query string of this page
     is passed to the embedded stream page. For tests/test_streamer_desktop_vagon.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock embed</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #vagonFrame { position: fixed; top: 40px; left: 0; width: 100vw; height: calc(100vh - 40px); border: 0; }
  #bar { position: fixed; top: 0; left: 0; height: 40px; width: 100vw; background: #222; color: #ccc; font: 14px sans-serif; line-height: 40px; padding-left: 12px; }
</style>
</head>
<body>
<div id="bar">Embedding page (not the stream)</div>
<iframe id="vagonFrame" allow="autoplay; microphone *; camera *; fullscreen; clipboard-read *; clipboard-write *; encrypted-media *;"></iframe>
<script>
  document.getElementById('vagonFrame').src = 'vagon_mock_stream.html' + location.search;
</script>
</body>
</html>
