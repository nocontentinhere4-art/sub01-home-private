<!doctype html><meta charset="utf-8"><title>Baked receiver shader compile audit</title>
<style>body{margin:20px;background:#202622;color:#eef3ea;font:14px monospace}canvas{max-width:100%}pre{white-space:pre-wrap}</style>
<h1>Baked receiver shader compile audit</h1><p>Private synthetic shader fixture. This is a compile check, not house lighting acceptance.</p><pre id="result">Compiling…</pre>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import*as T from'./vendor/three.module.js';
import{RoomEnvironment}from'./vendor/RoomEnvironment.js';
import{configureBakedReceiverLighting}from'./baked_receiver_lighting.mjs';
const result=document.querySelector('#result');
try{
 const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(640,320);renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
 const errors=[];renderer.debug.onShaderError=(gl,program,vs,fs)=>errors.push([gl.getProgramInfoLog(program),gl.getShaderInfoLog(vs),gl.getShaderInfoLog(fs)]);
 const scene=new T.Scene(),camera=new T.PerspectiveCamera(50,2,.1,50);camera.position.set(0,2,7);camera.lookAt(0,0,0);
 const environment=new RoomEnvironment(),generator=new T.PMREMGenerator(renderer);const env=generator.fromScene(environment,.04);scene.environment=env.texture;environment.dispose();generator.dispose();
 scene.add(new T.HemisphereLight(0xffffff,0x777777,1),new T.AmbientLight(0xffffff,.1));
 const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(2,5,3);sun.castShadow=true;sun.shadow.mapSize.set(128,128);scene.add(sun);
 scene.add(new T.PointLight(0xffddbb,8));
 const texture=new T.DataTexture(new Uint8Array([70,70,70,255]),1,1);texture.needsUpdate=true;texture.channel=1;texture.generateMipmaps=false;
 const nightLightMap={value:texture},nightLightIntensity={value:1};
 const materials=[new T.MeshStandardMaterial({color:0xaaaaaa,lightMap:texture}),new T.MeshStandardMaterial({color:0xaaaaaa,lightMap:texture}),new T.MeshPhysicalMaterial({color:0xaaaaaa,lightMap:texture,clearcoat:.3,sheen:.4,sheenColor:new T.Color(.8,.7,.6)})];
 materials[2].userData.lightOak=true;
 const materialGradeOak=shader=>{shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>','#include <map_fragment>\ndiffuseColor.rgb = pow(max(diffuseColor.rgb, vec3(.0001)), vec3(.45)) * vec3(.95,.90,.80);');};
 for(let i=0;i<materials.length;i++){
  if(i>0)configureBakedReceiverLighting(T,materials[i],{occludedDayReady:true,nightLightMap,nightLightIntensity,materialGradeOak});
  const geometry=new T.BoxGeometry(1.3,1.3,1.3);geometry.setAttribute('uv1',geometry.getAttribute('uv').clone());
  const mesh=new T.Mesh(geometry,materials[i]);mesh.position.x=(i-1)*1.7;mesh.castShadow=mesh.receiveShadow=true;scene.add(mesh);
 }
 await renderer.compileAsync(scene,camera);renderer.render(scene,camera);
 const glError=renderer.getContext().getError();
 const badPrograms=renderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length;
 const report={ready:true,fixture:'dynamic Standard / baked Standard / baked Physical with oak, sheen and clearcoat',programs:renderer.info.programs.length,badPrograms,shaderErrors:errors,glError,passed:!badPrograms&&!errors.length&&!glError};
 result.textContent=JSON.stringify(report,null,2);document.body.dataset.status=report.passed?'passed':'failed';
}catch(error){result.textContent=String(error.stack||error);document.body.dataset.status='failed';}
</script>
