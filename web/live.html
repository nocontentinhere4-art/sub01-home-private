<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUB-01 · live</title><link rel="icon" href="/favicon.svg"><style>
:root{color-scheme:dark;--bg:#08080b;--fg:#ececf2;--muted:#8f8fa3;--line:#292932;--accent:#ff6a00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px ui-monospace,"SF Mono",Menlo,Consolas,monospace}header{display:flex;align-items:center;gap:18px;padding:24px 28px;border-bottom:1px solid var(--line)}h1{font-size:20px;letter-spacing:.16em;margin:0;background:var(--accent);color:#08080b;padding:3px 10px;border-radius:2px}a{color:var(--muted);text-decoration:none}a:hover{color:var(--fg)}#status{margin-left:auto;color:var(--muted);font-size:12px}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;max-width:1680px;margin:auto;padding:24px 28px}video{display:block;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line)}h2{font-size:14px;font-weight:500;margin:0 0 16px}p{color:var(--muted);line-height:1.6;font-size:12px}aside{border-left:1px solid var(--line);padding-left:24px;display:flex;flex-direction:column;min-height:360px}#messages{height:250px;overflow:auto;flex:1;margin-bottom:16px}#messages p{color:var(--fg);border-bottom:1px solid var(--line);padding:10px 0;margin:0;overflow-wrap:anywhere}label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}textarea{width:100%;resize:vertical;min-height:88px;background:#101015;border:1px solid var(--line);border-radius:4px;color:var(--fg);padding:12px;font:inherit}button{background:var(--accent);color:#08080b;border:0;padding:11px 18px;font:inherit;border-radius:3px;cursor:pointer;margin-top:10px}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#feedback{min-height:36px}#mode{color:#ff9a3c}footer{padding:0 28px 24px;color:var(--muted);font-size:11px}@media(max-width:850px){header{padding:18px 16px;gap:12px}h1{font-size:17px}main{grid-template-columns:1fr;padding:16px;gap:20px}aside{border-left:0;border-top:1px solid var(--line);padding:20px 0 0;min-height:300px}#messages{max-height:180px}footer{padding:0 16px 20px}#status{max-width:130px;text-align:right}}
.stage{position:relative}.pc-screen{position:absolute;right:12px;bottom:48px;width:30%;max-width:360px;background:#101015;border:1px solid var(--line);box-shadow:0 4px 24px #0008;pointer-events:auto}.pc-screen h2{font-size:10px;letter-spacing:.1em;padding:7px 9px;margin:0}.pc-view{position:relative;aspect-ratio:16/9;display:grid;place-items:center;background:#08080b}.pc-view img{width:100%;height:100%;object-fit:contain;position:absolute}.pc-view span{font-size:10px;color:var(--muted);padding:8px;text-align:center}.pc-view img[hidden]{display:none}@media(max-width:600px){.pc-screen{width:38%;right:6px;bottom:42px}.pc-screen h2{font-size:8px;padding:4px 6px}.pc-view span{font-size:8px}}
.pc-heading{display:flex;align-items:center;justify-content:space-between}.pc-heading button{margin:0 7px 0 0;padding:3px 6px;background:transparent;color:var(--fg);font-size:10px;border:1px solid var(--line)}.pc-screen.expanded{width:calc(100% - 24px);max-width:none;right:12px;top:12px;bottom:48px;z-index:2}.pc-screen.expanded .pc-view{height:calc(100% - 27px);aspect-ratio:auto}
</style></head><body><header><h1>SUB-01</h1><span id="status" role="status">Connecting…</span></header><main><section aria-label="Live video"><div class="stage"><video id="video" controls playsinline muted autoplay></video><section class="pc-screen" aria-label="PC screen preview"><div class="pc-heading"><h2>PC SCREEN</h2><button id="pc-expand" type="button" aria-expanded="false">Expand</button></div><div class="pc-view"><span id="pc-state" role="status">Connecting…</span><img id="pc-frame" alt="Live PC screen" hidden></div></section></div><p>Live preview · enable audio in the player · a few seconds behind live</p><p id="mode">Checking status…</p></section><aside><h2>Live chat</h2><div id="messages" aria-label="Recent messages"></div><form id="chat"><label for="text">Message SUB-01</label><textarea id="text" maxlength="280" required placeholder="Leave a message…"></textarea><button id="send" type="submit">Send</button><p id="feedback" role="status"></p></form><p>Messages are moderated. Sending a message does not grant control permissions.</p></aside></main><script src="/live-config.js"></script><script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js" crossorigin="anonymous"></script><script>
const base=window.SUB01_PREVIEW_ORIGIN,video=document.querySelector('#video'),statusEl=document.querySelector('#status'),mode=document.querySelector('#mode'),messages=document.querySelector('#messages');let hls,attached=false,retryTimer=null;
function restartVideo(){if(retryTimer)return;statusEl.textContent='Reconnecting video';attached=false;retryTimer=setTimeout(()=>{retryTimer=null;start();},2000);if(hls){hls.destroy();hls=null;}video.removeAttribute('src');video.load();}
video.addEventListener('error',restartVideo);
function start(){if(attached||retryTimer||!base)return;attached=true;const src=base+'/hls/live.m3u8';if(video.canPlayType('application/vnd.apple.mpegurl'))video.src=src;else if(window.Hls&&Hls.isSupported()){hls=new Hls({maxBufferLength:20,liveSyncDurationCount:5});hls.loadSource(src);hls.attachMedia(video);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)restartVideo();});}else statusEl.textContent='Browser not supported';}
async function refresh(){try{const r=await fetch(base+'/status',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error();const s=await r.json();statusEl.textContent=s.online?(retryTimer||video.error?'Reconnecting video':'● LIVE'):'Video temporarily offline';mode.textContent=s.agent==='paused'?'Manual control · agent in STOP':'Operational checks in progress';messages.replaceChildren(...s.messages.map(m=>{const p=document.createElement('p');p.textContent=m.text;return p}));if(s.online)start();}catch{statusEl.textContent='Connection unavailable';}setTimeout(refresh,5000)}
document.querySelector('#chat').addEventListener('submit',async e=>{e.preventDefault();const t=document.querySelector('#text'),b=document.querySelector('#send'),f=document.querySelector('#feedback');b.disabled=true;try{const r=await fetch(base+'/chat',{method:'POST',headers:{'Content-Type':'text/plain'},body:t.value,signal:AbortSignal.timeout(15000)}),d=await r.json();f.textContent=d.ok?'Message received.':d.code==='duplicate'?'This message was already received. Try a different message.':r.status===429?'Please wait a few seconds.':r.status===503?'Chat unavailable. Please try again later.':'Message rejected by the chat filter.';if(d.ok)t.value='';}catch{f.textContent='Message not confirmed. Check your connection.';}setTimeout(()=>b.disabled=false,12000)});refresh();
</script><script>
const pcFrame=document.querySelector('#pc-frame'),pcState=document.querySelector('#pc-state'),pcPanel=document.querySelector('.pc-screen'),pcExpand=document.querySelector('#pc-expand');let pcURL=null,pcAbort=null,pcGeneration=0,pcExpiry=null;
function clearPC(label){pcGeneration++;if(pcAbort)pcAbort.abort();clearTimeout(pcExpiry);pcFrame.hidden=true;pcFrame.removeAttribute('src');if(pcURL)URL.revokeObjectURL(pcURL);pcURL=null;pcState.textContent=label;}
async function pollPC(){const generation=pcGeneration;let candidate=null;try{if(document.hidden||!navigator.onLine||!base){clearPC('Screen unavailable');return;}pcAbort=new AbortController();const controller=pcAbort,timer=setTimeout(()=>controller.abort(),3000);try{const response=await fetch(base+'/screen.png',{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error();const blob=await response.blob();candidate=URL.createObjectURL(blob);const next=new Image();next.src=candidate;await next.decode();if(generation!==pcGeneration||document.hidden||!navigator.onLine)return;const old=pcURL;pcURL=candidate;candidate=null;pcFrame.src=pcURL;pcFrame.hidden=false;pcState.textContent='';if(old)URL.revokeObjectURL(old);clearTimeout(pcExpiry);pcExpiry=setTimeout(()=>clearPC('Screen unavailable'),3000);}finally{clearTimeout(timer);}}catch{if(generation===pcGeneration)clearPC('Screen hidden or unavailable');}finally{if(candidate)URL.revokeObjectURL(candidate);pcAbort=null;setTimeout(pollPC,1000);}}
function expandPC(expanded){pcPanel.classList.toggle('expanded',expanded);pcExpand.setAttribute('aria-expanded',String(expanded));pcExpand.textContent=expanded?'Close':'Expand';}
pcExpand.addEventListener('click',()=>expandPC(!pcPanel.classList.contains('expanded')));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pcPanel.classList.contains('expanded')){expandPC(false);pcExpand.focus();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearPC('Screen hidden');});window.addEventListener('offline',()=>clearPC('Screen unavailable'));pcFrame.addEventListener('error',()=>clearPC('Screen unavailable'));pollPC();
</script></body></html>
