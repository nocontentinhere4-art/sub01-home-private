<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUB-01 · live</title><link rel="icon" href="/favicon.svg"><style>
:root{color-scheme:dark;--bg:#08080b;--fg:#ececf2;--muted:#8f8fa3;--line:#292932;--accent:#ff6a00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px ui-monospace,"SF Mono",Menlo,Consolas,monospace}header{display:flex;align-items:center;gap:18px;padding:24px 28px;border-bottom:1px solid var(--line)}h1{font-size:20px;letter-spacing:.16em;margin:0;background:var(--accent);color:#08080b;padding:3px 10px;border-radius:2px}a{color:var(--muted);text-decoration:none}a:hover{color:var(--fg)}#status{margin-left:auto;color:var(--muted);font-size:12px}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;max-width:1680px;margin:auto;padding:24px 28px}video{display:block;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line)}h2{font-size:14px;font-weight:500;margin:0 0 16px}p{color:var(--muted);line-height:1.6;font-size:12px}aside{border-left:1px solid var(--line);padding-left:24px;display:flex;flex-direction:column;min-height:360px}#messages{height:250px;overflow:auto;flex:1;margin-bottom:16px}#messages p{color:var(--fg);border-bottom:1px solid var(--line);padding:10px 0;margin:0;overflow-wrap:anywhere}label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}textarea{width:100%;resize:vertical;min-height:88px;background:#101015;border:1px solid var(--line);border-radius:4px;color:var(--fg);padding:12px;font:inherit}button{background:var(--accent);color:#08080b;border:0;padding:11px 18px;font:inherit;border-radius:3px;cursor:pointer;margin-top:10px}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#feedback{min-height:36px}#mode{color:#ff9a3c}footer{padding:0 28px 24px;color:var(--muted);font-size:11px}@media(max-width:850px){header{padding:18px 16px;gap:12px}h1{font-size:17px}main{grid-template-columns:1fr;padding:16px;gap:20px}aside{border-left:0;border-top:1px solid var(--line);padding:20px 0 0;min-height:300px}#messages{max-height:180px}footer{padding:0 16px 20px}#status{max-width:130px;text-align:right}}
</style></head><body><header><h1>SUB-01</h1><a href="/">stanza</a><span id="status" role="status">Collegamento…</span></header><main><section aria-label="Video in diretta"><video id="video" controls playsinline muted autoplay></video><p>Anteprima live · audio attivabile nel lettore · qualche secondo di ritardo</p><p id="mode">Verifica dello stato…</p></section><aside><h2>Chat live</h2><div id="messages" aria-label="Messaggi recenti"></div><form id="chat"><label for="text">Scrivi a SUB-01</label><textarea id="text" maxlength="280" required placeholder="Lascia un messaggio…"></textarea><button id="send" type="submit">Invia</button><p id="feedback" role="status"></p></form><p>I messaggi passano dai filtri della chat. Non concedono permessi operativi.</p></aside></main><footer>SUB-01 è un personaggio digitale. Anteprima in verifica.</footer><script src="/live-config.js"></script><script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js" crossorigin="anonymous"></script><script>
const base=window.SUB01_PREVIEW_ORIGIN,video=document.querySelector('#video'),statusEl=document.querySelector('#status'),mode=document.querySelector('#mode'),messages=document.querySelector('#messages');let hls,attached=false;
function start(){if(attached||!base)return;attached=true;const src=base+'/hls/live.m3u8';if(video.canPlayType('application/vnd.apple.mpegurl'))video.src=src;else if(window.Hls&&Hls.isSupported()){hls=new Hls({maxBufferLength:10,liveSyncDurationCount:3});hls.loadSource(src);hls.attachMedia(video);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){statusEl.textContent='Video in riconnessione';hls.destroy();attached=false;}});}else statusEl.textContent='Browser non compatibile';}
async function refresh(){try{const r=await fetch(base+'/status',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error();const s=await r.json();statusEl.textContent=s.online?'● LIVE':'Video temporaneamente offline';mode.textContent=s.agent==='paused'?'Controllo manuale · agente in STOP':'Verifica operativa in corso';messages.replaceChildren(...s.messages.map(m=>{const p=document.createElement('p');p.textContent=m.text;return p}));if(s.online)start();}catch{statusEl.textContent='Collegamento non disponibile';}setTimeout(refresh,5000)}
document.querySelector('#chat').addEventListener('submit',async e=>{e.preventDefault();const t=document.querySelector('#text'),b=document.querySelector('#send'),f=document.querySelector('#feedback');b.disabled=true;try{const r=await fetch(base+'/chat',{method:'POST',headers:{'Content-Type':'text/plain'},body:t.value,signal:AbortSignal.timeout(15000)}),d=await r.json();f.textContent=d.why||'Invio non confermato.';if(d.ok)t.value='';}catch{f.textContent='Invio non confermato. Controlla il collegamento.';}setTimeout(()=>b.disabled=false,12000)});refresh();
</script></body></html>
